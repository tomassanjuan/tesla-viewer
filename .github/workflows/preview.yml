# Per-PR preview on Cloudflare (Workers static assets). Needs repo secrets:
# CLOUDFLARE_API_TOKEN (Workers Scripts:Edit) and CLOUDFLARE_ACCOUNT_ID.
name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    if: github.event.action != 'closed'
    needs: test
    runs-on: ubuntu-latest
    env:
      NAME: ${{ github.event_name == 'pull_request' && format('tesla-viewer-pr-{0}', github.event.number) || 'tesla-viewer' }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ env.NAME }}
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.d.outputs.deployment-url }}`;
            const body = `Preview: ${url}`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const c = data.find((x) => x.body.startsWith('Preview: '));
            if (c) await github.rest.issues.updateComment({ ...context.repo, comment_id: c.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name tesla-viewer-pr-${{ github.event.number }} --force
