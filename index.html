<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla Viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side">
  <h1>Tesla Viewer</h1>
  <p class="muted">Free, on-device dashcam viewer. Nothing is uploaded.</p>
  <div id="drop"><strong>Drop TeslaCam folder or clips here</strong>
    <div class="row"><label class="btn">Folder<input id="pickDir" type="file" webkitdirectory hidden></label>
    <label class="btn">Files<input id="pickFiles" type="file" accept=".mp4" multiple hidden></label></div></div>
  <div id="events"></div>
  <details id="crypt"><summary>Encrypted clips (2026.20+) <em>experimental</em></summary>
    <p class="muted">Decryption runs locally. The per-file key comes from Tesla, tied to your account.</p>
    <p id="cryptCount" class="muted"></p>
    <label>Tesla bearer token <input id="token" type="password" placeholder="from dashcam.tesla.com"></label>
    <button id="fetchKeys">Fetch keys &amp; decrypt</button>
    <label>or paste key JSON <textarea id="keyJson" rows="3" placeholder='{"uuid":"base64key"}'></textarea></label>
    <button id="useKeys">Decrypt with pasted keys</button>
    <p id="cryptMsg" class="muted"></p>
  </details>
</aside>
<main>
  <div id="stage"><div id="grid"></div><div id="empty">Load a TeslaCam folder to begin</div>
    <div id="hud" hidden></div></div>
  <div id="bar">
    <button id="play" title="Space">▶</button>
    <button id="stepB" title=",">◀|</button><button id="stepF" title=".">|▶</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="time">0:00 / 0:00</span>
    <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>10</option></select>
    <select id="layout"><option value="auto">Grid</option><option value="focus">Focus</option></select>
    <select id="units"><option value="kmh">km/h</option><option value="mph">mph</option></select>
    <button id="csv">CSV</button>
  </div>
  <div id="panels"><canvas id="graph" width="700" height="120"></canvas><canvas id="map" width="240" height="120"></canvas></div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
